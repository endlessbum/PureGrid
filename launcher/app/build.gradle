plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.3'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // WorkManager for background refreshes
    implementation 'androidx.work:work-runtime:2.9.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    // On a machine whose project path contains non-ASCII characters, `gradlew test` cannot load
    // the test classes (a Gradle worker arg-file encoding issue on Windows): every test fails
    // with ClassNotFoundException while the classes themselves are fine. Run the suite from an
    // ASCII-only path, or from an IDE.
    testImplementation 'junit:junit:4.13.2'
}
